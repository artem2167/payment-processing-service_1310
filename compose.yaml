name: async-payments

x-app: &app
  image: async-payments:local
  build:
    context: .
    target: runtime
  init: true
  stop_grace_period: 30s

x-app-environment: &app-environment
  API_KEY: ${API_KEY:?Copy .env.example to .env first}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
  RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-5}
  WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10}
  OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-0.5}
  PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-5}
  RECOVERY_DELAY: ${RECOVERY_DELAY:-2}
  GATEWAY_MIN_DELAY: ${GATEWAY_MIN_DELAY:-2}
  GATEWAY_MAX_DELAY: ${GATEWAY_MAX_DELAY:-5}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.2.9-management
    hostname: payments-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health', headers={'X-API-Key': os.environ['API_KEY']}); urllib.request.urlopen(request, timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  consumer:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  webhook-receiver:
    <<: *app
    profiles: ["demo"]
    restart: unless-stopped
    command: ["uvicorn", "examples.webhook_receiver:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${WEBHOOK_RECEIVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
